name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=20": test the floor plus current releases.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm run pack:check

  astro:
    name: Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors peerDependencies.astro ("^5 || ^6 || ^7").
        astro: [5, 6, 7]
    defaults:
      run:
        working-directory: test/fixtures/astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify:astro${{ matrix.astro }}
